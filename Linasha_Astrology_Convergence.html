        async function deriveKey(pin, salt) {
            const enc = new TextEncoder();
            const keyMaterial = await window.crypto.subtle.importKey(
                "raw", enc.encode(pin), { name: "PBKDF2" }, false, ["deriveKey"]
            );
            return window.crypto.subtle.deriveKey(
                {
                    name: "PBKDF2",
                    salt: salt,
                    iterations: 100000,
                    hash: "SHA-256"
                },
                keyMaterial,
                { name: "AES-GCM", length: 256 },
                false,
                ["decrypt"]
            );
        }

        function b64ToUint8(b64) {
            const binary = atob(b64);
            const len = binary.length;
            const bytes = new Uint8Array(len);
            for (let i = 0; i < len; i++) {
                bytes[i] = binary.charCodeAt(i);
            }
            return bytes;
        }

        async function unlock() {
            const pin = document.getElementById('pin-input').value.trim();
            const errorDiv = document.getElementById('error');
            const statusDiv = document.getElementById('status');
            const btn = document.getElementById('btn-submit');
            errorDiv.style.display = 'none';
            statusDiv.style.display = 'block';
            btn.disabled = true;

            try {
                const salt = b64ToUint8(PAYLOAD.salt);
                const iv = b64ToUint8(PAYLOAD.iv);
                const ciphertext = b64ToUint8(PAYLOAD.ciphertext);

                const key = await deriveKey(pin, salt);
                const decrypted = await window.crypto.subtle.decrypt(
                    { name: "AES-GCM", iv: iv },
                    key,
                    ciphertext
                );

                const dec = new TextDecoder();
                const html = dec.decode(decrypted);

                // Remember PIN in sessionStorage so user doesn't re-type across navigation
                sessionStorage.setItem('astrology_pin', pin);

                // Replace document with decrypted content
                document.open();
                document.write(html);
                document.close();
            } catch (e) {
                console.error(e);
                statusDiv.style.display = 'none';
                errorDiv.style.display = 'block';
                btn.disabled = false;
                document.getElementById('pin-input').value = '';
                document.getElementById('pin-input').focus();
            }
        }

        // Auto-unlock if session has PIN saved
        window.addEventListener('DOMContentLoaded', () => {
            const savedPin = sessionStorage.getItem('astrology_pin');
            if (savedPin) {
                document.getElementById('pin-input').value = savedPin;
                unlock();
            }
        });
    </script>
